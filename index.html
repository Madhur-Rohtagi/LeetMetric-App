<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leetmetric App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h2 style="font-family:Georgia, 'Times New Roman', Times, serif;">JAVA SCRIPT PROJECT (fetching data using Leetcode API)</h2>
    </header>
    <div class="container">
        <!-- heading
            user
            stats -->

        <h1>Leet Metric</h1>

        <div class="user-container">
            <p>Enter your Username below:-</p>
            <div class="user-input-container">
                <input type="text" id="username" placeholder="Enter your username here...">
                <button id="search">Search</button>
            </div>
        </div>

        <div class="stats-container">

            <div class="progress">

                <div class="progress-items">
                    <div class="easy-progress  circle">
                        <span class="easy-label"></span>
                        Easy
                    </div>
                </div>

                <div class="progress-items">
                    <div class="medium-progress circle">
                        <span class="medium-label"></span>
                        Medium
                    </div>
                </div>

                <div class="progress-items">
                    <div class="hard-progress  circle">
                        <span class="hard-label"></span>
                        Hard
                    </div>
                </div>

            </div>
            
            <div class="stats-card">
                <!-- directly populate card here from JS code -->
            </div>
        </div>
    </div>

    <footer>
        <a href="#">Copyright &copy; 2026 Madhur Rohtagi. All rights reserved.</a>
    </footer>
</body>
</html>
